<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mirai Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Paleta da Mirai (guia de marca). O nome "mcsystem" ficou por
              // compatibilidade: são centenas de classes pelo sistema.
              mcsystem: {
                900: '#101510', // painel escuro (menu lateral)
                800: '#1c241c', // hover sobre o escuro
                700: '#2f6f0b', // verde escuro, texto pequeno sobre claro
                600: '#3c8d10', // verde da marca, texto e linhas
                500: '#3c8d10', // ação principal (aguenta texto branco)
                400: '#4fa61a', // hover da ação principal
                300: '#9fd46b',
                200: '#cfe8b4',
                100: '#eef5e4', // fundo alternativo
                50: '#f6faf1',  // fundo principal
              },
              // Lime de destaque: sempre com texto escuro por cima, nunca branco.
              mirai: {
                lime: '#84e80e',
                ink: '#0c140c',
                ink2: '#38453a',
                muted: '#5e6c61',
                panel: '#101510',
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['Space Grotesk', 'Inter', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html {
    font-size: 100%; /* Garantir 100% do tamanho padrão do navegador */
  }
  
  body { 
    font-family: 'Inter', system-ui, sans-serif; 
    background-color: #f6faf1;
    font-size: 14px; /* Tamanho padrão de sistemas web */
    line-height: 1.5;
    margin: 0;
    padding: 0;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  
  * {
    box-sizing: border-box;
  }

  /* Títulos na fonte da marca */
  h1, h2, h3 {
    font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
    letter-spacing: -0.01em;
  }
  
  /* Custom Scrollbar for Kanban */
  .scrollbar-hide::-webkit-scrollbar {
      display: none;
  }
  .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
  }
</style>

  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3",
    "xlsx": "https://esm.sh/xlsx@0.18.5"
  }
}
</script>
<script src="https://apis.google.com/js/api.js"></script>
</head>

</body>
</html>
